aid: nomad-homes
name: Nomad Homes
description: >-
  Nomad Homes is a Partech-backed proptech company originally launched as a real-estate
  marketplace. It has since rebranded and pivoted to RemyAI (getremy.ai) — "the 24/7
  intelligent assistant for real estate agents." RemyAI listens to agents' calls and
  texts, transcribes and summarizes them, auto-creates follow-up tasks and reminders,
  organizes buyer/seller contacts, and manages voicemail across iOS, Android, and
  desktop. The company's original domain nomadhomes.co now 301-redirects to getremy.ai.
  RemyAI publishes a public /.well-known/ai-plugin.json and an llms.txt describing the
  product, but it exposes NO public developer API, SDK, OpenAPI, or developer portal
  (its ai-plugin manifest explicitly declares api.type=none and auth.type=none).
